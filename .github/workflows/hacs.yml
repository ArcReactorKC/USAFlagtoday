name: HACS
on:
  push:
  pull_request:
  workflow_dispatch:
permissions: {}
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          # Custom repository works without an upstream brands submission.
          # Remove once mast_flag assets are accepted by home-assistant/brands.
          ignore: brands
